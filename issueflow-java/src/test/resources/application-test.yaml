# Test profile — uses H2 in-memory database instead of PostgreSQL
spring:
  datasource:
    url: jdbc:h2:mem:issueflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database: H2
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

